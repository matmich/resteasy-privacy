<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>RestEasy</title>
<style>
  :root { --fresh: #0E7C66; --mint: #E3F4EF; --ink: #0B1F1B; --mist: #F3F6F5; --muted: #5B6B67; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mist); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: min(440px, 92vw); background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center;
         box-shadow: 0 8px 24px rgba(11, 31, 27, .08); }
  .logo { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 8px; display: block; }
  h1 { font-size: 24px; letter-spacing: -.4px; margin: 8px 0 4px; }
  h1 span { color: var(--fresh); }
  p { color: var(--muted); line-height: 1.5; margin: 8px 0 20px; }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none;
         background: var(--fresh); color: #fff; margin: 10px 0; }
  .btn.alt { background: var(--mint); color: var(--fresh); }
  .stores { display: flex; gap: 10px; }
  .stores .btn { font-size: 14px; }
  .err { color: #D9480F; background: #FFF1EA; border-radius: 12px; padding: 12px; }
  [hidden] { display: none !important; }
  small { color: var(--muted); display: block; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
    <rect width="1024" height="1024" rx="230" fill="#0E7C66"/>
    <path d="M512 190C512 190 292 452 292 628a220 220 0 0 0 440 0C732 452 512 190 512 190Z" fill="#fff"/>
    <path d="M424 626L492 694L618 544" fill="none" stroke="#0E7C66" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Rest<span>Easy</span></h1>
  <p id="msg"></p>
  <div id="err" class="err" hidden></div>
  <a id="open" class="btn" href="resteasy://" hidden></a>
  <div id="stores" class="stores" hidden>
    <a class="btn alt" id="ios" href="https://apps.apple.com/app/id6815717216">App Store</a>
    <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.matmich.resteasy">Google Play</a>
  </div>
  <small id="hint"></small>
</main>
<script>
(function () {
  var T = {
    en: { opening: 'Opening RestEasy…', done: 'Your link is ready. Tap the button to continue in the app.', open: 'Open RestEasy', noapp: 'The app is not installed yet? Download it, then come back to this link from your e-mail.',
          expired: 'This link has expired or was already used. Please ask for a new one from the app (or ask your manager to resend the invitation).', generic: 'This page opens the RestEasy app. Open the link from your e-mail on the phone where RestEasy is installed.' },
    fr: { opening: 'Ouverture de RestEasy…', done: 'Votre lien est prêt. Appuyez sur le bouton pour continuer dans l’application.', open: 'Ouvrir RestEasy', noapp: 'L’application n’est pas encore installée ? Téléchargez-la, puis revenez sur le lien de votre e-mail.',
          expired: 'Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau depuis l’application (ou demandez à votre responsable de renvoyer l’invitation).', generic: 'Cette page ouvre l’application RestEasy. Ouvrez le lien de votre e-mail sur le téléphone où RestEasy est installé.' },
    de: { opening: 'RestEasy wird geöffnet…', done: 'Ihr Link ist bereit. Tippen Sie auf die Schaltfläche, um in der App fortzufahren.', open: 'RestEasy öffnen', noapp: 'Die App ist noch nicht installiert? Laden Sie sie herunter und öffnen Sie danach den Link aus Ihrer E-Mail erneut.',
          expired: 'Dieser Link ist abgelaufen oder wurde bereits verwendet. Fordern Sie in der App einen neuen an (oder bitten Sie Ihre Leitung, die Einladung erneut zu senden).', generic: 'Diese Seite öffnet die RestEasy-App. Öffnen Sie den Link aus Ihrer E-Mail auf dem Telefon, auf dem RestEasy installiert ist.' },
    pt: { opening: 'A abrir o RestEasy…', done: 'A sua ligação está pronta. Toque no botão para continuar na app.', open: 'Abrir o RestEasy', noapp: 'A app ainda não está instalada? Instale-a e volte a abrir a ligação do seu e-mail.',
          expired: 'Esta ligação expirou ou já foi utilizada. Peça uma nova na app (ou peça ao seu responsável para reenviar o convite).', generic: 'Esta página abre a app RestEasy. Abra a ligação do seu e-mail no telemóvel onde o RestEasy está instalado.' }
  };
  var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : 'en';

  var hash = location.hash || '';
  var query = location.search || '';
  var params = new URLSearchParams(hash.replace(/^#/, '') || query.replace(/^\?/, ''));
  var hasSession = params.get('access_token') && params.get('refresh_token');
  var hasError = params.get('error') || params.get('error_code');

  var msg = document.getElementById('msg');
  var open = document.getElementById('open');
  var hint = document.getElementById('hint');
  var stores = document.getElementById('stores');
  var err = document.getElementById('err');

  if (hasSession) {
    // Hand the session over to the app. The tokens only travel in this device's URL fragment; this page never sends them anywhere.
    var link = 'resteasy://' + (hash || ('?' + params.toString()));
    msg.textContent = t.done;
    open.textContent = t.open;
    open.href = link;
    open.hidden = false;
    stores.hidden = false;
    hint.textContent = t.noapp;
    setTimeout(function () { window.location.href = link; }, 400);
  } else if (hasError) {
    msg.textContent = '';
    err.textContent = t.expired;
    err.hidden = false;
    stores.hidden = false;
  } else {
    msg.textContent = t.generic;
    stores.hidden = false;
  }
})();
</script>
</body>
</html>
